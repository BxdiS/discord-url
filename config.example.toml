# Настройки опроса. Копируется в config.toml при первом запуске,
# config.toml в git не попадает.
#
# Секреты сюда не пишутся — токен и chat_id живут в .env

[polling]
# Базовый интервал между проверками одного кода, секунды.
interval_seconds = 60

# Общий лимит запросов к Discord на весь watchlist.
# Discord разрешает 50/сек — держим 1/сек с большим запасом.
rate_limit_per_second = 1.0

# Разброс интервала (±доля), чтобы запросы не слипались в пачки.
jitter = 0.2

# Сколько раз подряд надо получить 404, прежде чем слать алерт.
# Отсекает разовые сбои Discord ценой небольшой задержки.
confirmations = 3
confirm_delay_seconds = 2

[proxy]
# === ОТКАЗОУСТОЙЧИВАЯ РОТАЦИЯ ПРОКСИ ===
# При ошибке автоматически переключается на следующую прокси.
# Поддерживает три режима:

# Режим 1: Диапазон портов (самый экономный)
# Используется один хост, один пользователь, разные порты.
# Формат: user:pass@host:startport-endport
# Пример:
#   urls = "user283654o34626r400970:o7y50q@pool.proxys.world:10000-10999"
# Это создаст 1000 прокси с портами от 10000 до 10999.
#
# Альтернативный формат: host:startport-endport:user:pass
#   urls = "pool.proxys.world:10000-10999:user283654o34626r400970:o7y50q"

# Режим 2: Файл со всеми прокси (разные провайдеры/IP)
# Поддерживает форматы:
#   - host:port:user:pass          (автоматически конвертируется)
#   - http://user:pass@host:port   (стандартный URL)
#   - socks5://host:port           (SOCKS5)
#   - host:port                    (без авторизации)
# Пример:
#   urls = "proxies.txt"
# proxies.txt содержит прокси (по одной на строку):
#   8bf63a6a...@proxy.example.com:80
#   8bf63a6a...@proxy.example.com:81
#   ...
# При ошибке подключения автоматически переходит на следующую.

# Режим 3: Список URL в конфиге
# Пример:
#   urls = ["http://proxy1.example.com:8080", "http://proxy2.example.com:8080"]

# Выберите один из режимов выше. Удалить urls, если прокси не нужен.
urls = []

# Свежие свободные коды не проверяются N часов.
# Если код освобождается и вы его не забрали, 12 часов проверять его каждый
# цикл смысла нет. Поднимите алерт один раз и отдыхайте; проверка возобновится
# через N часов. Поставьте 0, чтобы проверять всегда.
skip_free_hours = 12.0

[telegram]
# Можно оставить пустым и задать через переменные окружения
# TG_BOT_TOKEN и TG_CHAT_ID — так безопаснее.
bot_token = ""
chat_id = ""
