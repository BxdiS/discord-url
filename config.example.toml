# Настройки опроса. Копируется в config.toml при первом запуске,
# config.toml в git не попадает.
#
# Секреты сюда не пишутся — токен и chat_id живут в .env

[polling]
# Базовый интервал между проверками одного кода, секунды.
interval_seconds = 60

# Общий лимит запросов к Discord на весь watchlist.
# Discord разрешает 50/сек — держим 1/сек с большим запасом.
rate_limit_per_second = 1.0

# Разброс интервала (±доля), чтобы запросы не слипались в пачки.
jitter = 0.2

# Сколько раз подряд надо получить 404, прежде чем слать алерт.
# Отсекает разовые сбои Discord ценой небольшой задержки.
confirmations = 3
confirm_delay_seconds = 2

# Свежие свободные коды не проверяются N часов.
# Если код освобождается и вы его не забрали, 12 часов проверять его каждый
# цикл смысла нет. Поднимите алерт один раз и отдыхайте; проверка возобновится
# через N часов. Поставьте 0, чтобы проверять всегда.
skip_free_hours = 12.0

[telegram]
# Можно оставить пустым и задать через переменные окружения
# TG_BOT_TOKEN и TG_CHAT_ID — так безопаснее.
bot_token = ""
chat_id = ""

[proxy]
# ОТКАЗОУСТОЙЧИВАЯ РОТАЦИЯ ПРОКСИ
# При ошибке подключения автоматически переключается на следующую прокси.
# Демон пробует все построчно из proxies.txt до первой работающей.

# Источник прокси: файл или список в конфиге
urls = []
# urls = "proxies.txt"
# urls = ["http://user:pass@proxy1:8080", "http://user:pass@proxy2:8080"]

# Использовать прокси и для Telegram уведомлений.
# По умолчанию false: бот развёрнут в Европе, Telegram доступен напрямую.
use_for_telegram = false

# Свежие свободные коды не проверяются N часов (когда используются прокси)
skip_free_hours = 12.0
